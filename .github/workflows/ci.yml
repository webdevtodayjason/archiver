name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Tiiny Brain runs wherever the farm runs, and until now it had only ever
    # been run on a Mac. windows-latest is the first proof that it starts there.
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: fresh-install tests
        run: python -m unittest discover -s tests -v

      - name: selfcheck
        run: python cockpit.py --selfcheck

      - name: the release tarball builds
        run: python scripts/build-release.py 0.0.0-ci --out "${{ runner.temp }}"
