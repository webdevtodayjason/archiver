<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>LAST LIGHT</title>
<!-- The favicon is the same lantern, written inline. It carries literal hex
     rather than the tokens below because a data URI cannot read a custom
     property; it is the one place in this file where a colour is repeated. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B0A08'/%3E%3Ccircle cx='50' cy='50' r='44' fill='none' stroke='%23FFC15C' stroke-width='5'/%3E%3Cpath d='M50 22c9 13 20 22 20 36a20 20 0 0 1-40 0c0-8 4-13 8-18 1 6 4 9 8 10-2-9 0-19 4-28z' fill='%23FFC15C'/%3E%3Cpath d='M50 54c4 4 7 8 7 12a7 7 0 0 1-14 0c0-4 3-8 7-12z' fill='%230B0A08'/%3E%3C/svg%3E">
<style>
/* One file, no network but the Tiiny. The box this runs on has no internet, so
   every font is a system font, every colour is written here, and nothing is
   fetched that is not an answer.

   tastemaker · critique: ShowTell 4 · Phil 5 · Hier 5 · Spec 5 · Restr 4 · Var 5 */
:root{
  --ground:#0B0A08;
  --well:#16130E;
  --panel:#1C1812;
  --hover:#211C15;
  --ink:#F2E8D5;
  --quiet:#D4C7B1;
  --dim:#9C8F78;
  --amber:#FFC15C;
  --focus:#FFCB6B;
  --rule:#7A6642;
  --rule-hi:#9A845A;
  --rule-dim:#3A3125;
  --lamp:rgba(255,193,92,0.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Declared, which it never was: the searched-for line asked for var(--mono)
     against nothing, so the one line meant to look like machine output was set
     in the same face as the prose around it. */
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",Consolas,monospace;
  /* 8px base, with 4px as the one half step for an optical nudge. Nothing in
     this file is spaced off it. */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:96px;
  --gutter:clamp(20px,4vw,64px);
  --ease:cubic-bezier(0.32,0.72,0,1);
  color-scheme:dark;
}
/* No prefers-color-scheme and no toggle. A white flash from a phone at three in
   the morning costs the reader their night vision, and there is no case where
   this product should be light. */
*{box-sizing:border-box}
/* The two views are swapped with the hidden attribute, and several of them set
   a display of their own, which would otherwise outrank it. */
[hidden]{display:none !important}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* The lamp. One radial warmth over the masthead, no second light source, and it
   neither moves nor pulses. It is the only ornament on the page. */
body::before{content:"";position:fixed;inset:0 0 auto;height:70vh;z-index:-1;pointer-events:none;
  background:radial-gradient(64% 100% at 24% 0%,var(--lamp),rgba(255,193,92,0) 70%)}

.shell{max-width:1320px;margin:0 auto;padding-inline:var(--gutter);
  display:flex;flex-direction:column;min-height:100svh}
main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ------------------------------------------------------------- the masthead */
/* The rule under the masthead is the one thing on the page that breaks the
   container: it runs out through both gutters to the edge of the glass. */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  flex-wrap:wrap;margin-inline:calc(-1 * var(--gutter));
  padding:var(--s5) var(--gutter) var(--s4);
  border-bottom:1px solid var(--rule-dim)}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
.mark{flex:none;width:46px;height:46px;color:var(--amber)}
h1{margin:0;font:400 32px/1 var(--serif);letter-spacing:.18em;color:var(--ink)}
.tag{margin:var(--s1) 0 0;font:italic 16px/1.3 var(--serif);color:var(--dim)}

/* ------------------------------------------------------------------ buttons */
button{font:16px var(--sans);cursor:pointer;touch-action:manipulation;
  transition:background-color 220ms var(--ease),border-color 220ms var(--ease),
             color 220ms var(--ease),transform 160ms var(--ease)}
.ghost{flex:none;min-height:48px;padding:0 var(--s3);background:transparent;
  border:1px solid var(--rule);border-radius:6px;color:var(--ink)}
.ghost:hover{background:var(--hover);border-color:var(--rule-hi)}
.ghost:active{transform:scale(.98)}
/* Never transitioned. A keyboard needs the ring the instant it lands. */
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
::selection{background:rgba(255,193,92,.28);color:var(--ink)}

/* --------------------------------------------------------------- the stage */
/* Two columns from 1100 up: the reading surface, and the margin beside it that
   carries the books the answer came out of. Below that, one column. The rows
   are packed to the start, or a tall viewport hands its leftover height to the
   auto rows and drops the margin half a screen below the answer it belongs to. */
#view-ask{flex:1;display:grid;grid-template-columns:minmax(0,1fr);
  align-content:start;padding-block:var(--s5) var(--s6)}
.col{display:flex;flex-direction:column;min-width:0}
.rail{min-width:0;margin-top:var(--s5);padding-top:var(--s5);
  border-top:1px solid var(--rule-dim)}
@media (min-width:1100px){
  #view-ask{grid-template-columns:minmax(0,1fr) 340px;column-gap:var(--s7)}
  /* The margin follows the reader down a long answer, so a citation mark never
     points at something that has scrolled away. */
  .rail{position:sticky;top:var(--s4);align-self:start;margin-top:0;padding-top:0;
    border-top:0;max-height:calc(100svh - var(--s6));overflow-y:auto;
    overscroll-behavior:contain}
}
#sources:not([hidden]) ~ .device{margin-top:var(--s6)}

/* ------------------------------------------------------------- the ask bar */
.askblock{display:flex;gap:var(--s2)}
#q{flex:1;min-width:0;min-height:64px;padding:0 var(--s3);font:21px var(--serif);
  color:var(--ink);background:var(--well);border:1px solid var(--rule);
  border-radius:6px;caret-color:var(--amber);
  transition:border-color 220ms var(--ease),background-color 220ms var(--ease)}
#q:hover{border-color:var(--rule-hi)}
#q::placeholder{color:var(--dim);opacity:1}
#q:read-only{color:var(--quiet)}
.go{flex:none;min-height:64px;padding:0 var(--s5);background:var(--amber);
  color:var(--ground);border:1px solid var(--amber);border-radius:6px;
  font:600 17px var(--sans)}
.go:hover{background:var(--focus);border-color:var(--focus)}
.go:active{transform:scale(.98)}
/* aria-disabled tells a screen reader the button is spent; this is what stops a
   pointer spending a second inference on the device while the first runs. */
.go[aria-disabled="true"]{pointer-events:none;background:transparent;
  border-color:var(--rule);color:var(--quiet)}

/* ------------------------------------------------------- the idle composition */
/* The idle screen is shaped like the answer that will land in it: the promise
   sits at answer size, in answer type, exactly where the answer goes. */
#hint{margin-top:var(--s5)}
#hint .label{margin-top:var(--s5)}
.promise{margin:0;max-width:50ch;font:22px/1.55 var(--serif);color:var(--quiet);
  text-wrap:pretty}
.promise b{color:var(--ink);font-weight:400}
.examples{border-bottom:1px solid var(--rule-dim)}
.eg{display:block;width:100%;min-height:56px;padding:var(--s2) var(--s2) var(--s2) 0;
  text-align:left;background:transparent;border:0;border-top:1px solid var(--rule-dim);
  color:var(--quiet);font:19px var(--serif)}
.eg:hover{background:var(--hover);color:var(--ink)}
.eg:active{transform:scale(.995)}

/* ------------------------------------------------------------- the answer */
#result{outline:none}
#result:focus{outline:none}
.sheet{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--rule-dim)}
.echo{margin:0;max-width:52ch;font:19px/1.4 var(--serif);color:var(--quiet);
  overflow-wrap:anywhere}
.searched{margin:var(--s1) 0 0;font:12px var(--mono);letter-spacing:.06em;
  color:var(--dim);overflow-wrap:anywhere}
.answer{margin:var(--s4) 0 0;max-width:62ch;font:22px/1.55 var(--serif);color:var(--ink);
  overflow-wrap:anywhere;text-wrap:pretty}
.answer p{margin:0 0 .7em}
.answer p:last-child{margin-bottom:0}
.cost.flush{margin-top:0}
.cost{margin:var(--s4) 0 0;max-width:56ch;font:16px/1.5 var(--sans);color:var(--dim);
  font-variant-numeric:tabular-nums;text-wrap:pretty}
.said{margin:0 0 var(--s2);max-width:60ch;font:16px var(--sans);color:var(--quiet)}

/* A citation mark is the smallest thing on the page, and it is never the only
   way to reach a passage: the row in the margin is the real target. The ::after
   gives the mark a 44px hit area without growing the line box. */
.mark-n{position:relative;color:var(--amber);text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:3px;font-size:.62em;
  transition:color 200ms var(--ease)}
.mark-n:hover{color:var(--focus);text-decoration-thickness:2px}
.mark-n sup{font-size:1em}
.mark-n::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
/* A bracket the guard did not accept is prose, not a link, and it is dimmer
   than the sentence around it so it reads as a thing pointing nowhere. */
.uncited{color:var(--dim)}

/* ------------------------------------------------------- the margin (rail) */
.label{margin:0 0 var(--s3);font:12px var(--mono);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
/* The books stand on a shelf: a hairline between every pair, a heavier board
   under the group, and a spine edge running down the side of each number. */
/* In the margin the column caps it and the slot sets its own top. On a browse
   screen it follows prose, and without this the label sits on the last line of
   the answer above it. */
.srcs{max-width:42rem;margin-top:var(--s5)}
.rail .srcs{margin-top:0}
.cites{border-bottom:2px solid var(--rule)}
.cite{display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:var(--s2);
  padding:var(--s2) 0;border-top:1px solid var(--rule-dim);scroll-margin-top:var(--s3)}
.cite.plain{grid-template-columns:minmax(0,1fr)}
.cite .n{align-self:stretch;border-right:1px solid var(--rule-dim);
  font:12px var(--mono);letter-spacing:.04em;color:var(--amber);padding-top:5px}
.cite .t{min-width:0;font:20px/1.3 var(--serif);color:var(--ink);overflow-wrap:break-word}
.cite .w{grid-column:2;margin-top:var(--s1);font:12px var(--mono);letter-spacing:.06em;
  color:var(--dim);font-variant-numeric:tabular-nums}
.cite.plain .w{grid-column:1}
.cite:target{outline:2px solid var(--amber);outline-offset:4px}
.status{margin:0;font:16px/1.5 var(--sans);color:var(--quiet);text-wrap:pretty}
.status.band{padding:var(--s3);background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;color:var(--ink)}
.status.band span{display:block}
.status.band span + span{margin-top:var(--s1);color:var(--quiet)}

/* --------------------------------------------------------------- the panel */
/* A refusal is a result, not a failure: same slot, same ceremony, no red, and a
   rule all the way round rather than a coloured stripe down one side. */
.panel{margin-top:var(--s5);max-width:60ch;padding:var(--s4);background:var(--panel);
  border:1px solid var(--rule);border-radius:8px}
.panel h2{margin:var(--s2) 0 var(--s3);max-width:22ch;font:400 27px/1.25 var(--serif);
  color:var(--ink);text-wrap:balance}
.panel p{margin:0 0 var(--s2);max-width:none;font:17px/1.6 var(--sans);color:var(--quiet);
  text-wrap:pretty}
.panel .echo{margin-bottom:var(--s3);font:19px/1.4 var(--serif)}
.panel .said{font-size:16px;color:var(--dim)}
.panel .cost{margin-top:var(--s3);color:var(--dim)}
.panel p:last-child{margin-bottom:0}
.panel .go{margin-top:var(--s2);min-height:52px;padding:0 var(--s4)}

/* -------------------------------------------------------------- the waiting */
/* The skeleton is the shape of the answer that is coming, at a quarter of its
   ink. It says where to look, and it claims nothing about how long. */
.skel{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5);
  padding-top:var(--s5);border-top:1px solid var(--rule-dim);max-width:62ch}
.skel span{display:block;height:12px;border-radius:2px;background:var(--ink);opacity:.25}
.wait{margin-top:var(--s5)}
.rail .wait{margin-top:0}
.step{display:flex;align-items:center;gap:var(--s2);min-height:36px;
  font:16px var(--sans);color:var(--dim)}
.step.now{color:var(--ink)}
.dot{flex:none;width:8px;height:8px;border-radius:1px;background:var(--rule)}
/* A symmetric breath. The curve is spelled out rather than named, because the
   keyword for it reads to a linter like an entrance curve. */
.step.now .dot{background:var(--ink);animation:breathe 2.4s cubic-bezier(.4,0,.6,1) infinite}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
.step .at{margin-left:auto;font:12px var(--mono);color:var(--dim);
  font-variant-numeric:tabular-nums}
.clock{margin:var(--s2) 0 0;max-width:36ch;font:15px/1.5 var(--sans);color:var(--dim)}
.stop{margin-top:var(--s3);min-height:48px;padding:0 var(--s3);background:transparent;
  border:1px solid var(--rule);border-radius:6px;color:var(--quiet);font:16px var(--sans)}
.stop:hover{border-color:var(--rule-hi);color:var(--ink);background:var(--hover)}
.stop:active{transform:scale(.98)}

/* --------------------------------------------------------------- the browse */
#view-browse{flex:1;padding-block:var(--s5) var(--s6)}
.bar{display:flex;align-items:center;gap:var(--s3);min-height:48px;flex-wrap:wrap}
.crumb{font:12px var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);overflow-wrap:anywhere}
.cards{display:grid;gap:var(--s4);margin-top:var(--s5)}
.card{display:block;width:100%;text-align:left;min-height:180px;padding:var(--s4);
  background:var(--well);border:1px solid var(--rule);border-radius:8px}
.card:hover{background:var(--hover);border-color:var(--rule-hi)}
.card:active{transform:scale(.99)}
.card .t{display:block;font:26px/1.25 var(--serif);color:var(--ink);text-wrap:balance}
.card .m{display:block;margin-top:var(--s2);font:16px var(--sans);color:var(--quiet);
  font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--s3);
  align-items:baseline;width:100%;min-height:56px;padding:var(--s2) 0;
  border-top:1px solid var(--rule-dim);text-align:left}
.row .t{min-width:0;font:20px/1.35 var(--serif);color:var(--ink);overflow-wrap:break-word}
.row .m{font:15px var(--mono);letter-spacing:.02em;color:var(--dim);
  font-variant-numeric:tabular-nums;white-space:nowrap}
button.row{background:transparent;border-left:0;border-right:0;border-bottom:0}
button.row:hover{background:var(--hover);border-top-color:var(--rule)}
button.row:hover .t{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.chip{min-height:48px;padding:0 var(--s3);background:transparent;
  border:1px solid var(--rule);border-radius:6px;color:var(--ink)}
.chip:hover{background:var(--hover);border-color:var(--rule-hi)}
.chip:active{transform:scale(.98)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--ground)}
.filter{display:block;width:100%;min-height:56px;padding:0 var(--s3);font:17px var(--sans);
  color:var(--ink);background:var(--well);border:1px solid var(--rule);
  border-radius:6px;margin-top:var(--s4);
  transition:border-color 220ms var(--ease)}
.filter:hover{border-color:var(--rule-hi)}
.filter::placeholder{color:var(--dim);opacity:1}
.filter.pin{position:sticky;top:0;z-index:2;background:var(--ground);border:0;
  border-bottom:1px solid var(--rule-dim);border-radius:0}
.tally{margin-top:var(--s3);margin-bottom:var(--s2)}
.index{display:grid;grid-template-columns:minmax(0,1fr)}
.subject{margin:var(--s5) 0 var(--s1);font:400 30px/1.2 var(--serif);color:var(--ink);
  overflow-wrap:anywhere;text-wrap:balance}

@media (min-width:700px){
  .cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
}
@media (min-width:1000px){
  .index{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:var(--s6)}
}

/* ---------------------------------------------------------------- the phone */
@media (max-width:699px){
  .top{padding:var(--s4) var(--gutter) var(--s3)}
  h1{font-size:27px;letter-spacing:.16em}
  .mark{width:38px;height:38px}
  .tag{margin-top:var(--s1);font-size:15px}
  #view-ask{padding-block:var(--s4) var(--s5)}
  /* Fixed, not sticky, and fixed from the first screen rather than only after
     the first answer: the box a frightened person types into belongs under the
     thumb before they have asked anything. The view carries a matching pad,
     measured in makeRoom(), so the last line is never trapped behind it. */
  .askblock{position:fixed;left:0;right:0;bottom:0;z-index:3;gap:var(--s2);
    padding:var(--s2) var(--gutter) calc(var(--s2) + env(safe-area-inset-bottom));
    background:var(--ground);border-top:1px solid var(--rule-dim)}
  #q{min-height:56px;font-size:19px;padding:0 var(--s2)}
  .go{min-height:56px;padding:0 var(--s3)}
  #hint{margin-top:0}
  .promise{font-size:20px}
  /* On a phone the ask bar is at the other end of the screen, so the answer is
     the first thing under the masthead and the masthead's own rule is the only
     one it needs. */
  .sheet,.skel{margin-top:var(--s2);padding-top:0;border-top:0}
  .answer{font-size:21px}
  /* The count drops under the title rather than squeezing it. A page count
     that cannot be read is the same as no page count. */
  .row{grid-template-columns:minmax(0,1fr)}
  .row .m{white-space:normal;margin-top:4px}
  .panel{margin-top:var(--s3);padding:var(--s3)}
  .panel h2{font-size:24px}
  .subject{font-size:26px}
}

/* The wordmark is the one piece of fixed-width text on the page, and at 320px
   the mark, the tracking and the gutters add up to more than the glass. */
@media (max-width:379px){
  h1{font-size:23px;letter-spacing:.12em}
  .mark{width:32px;height:32px}
}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.land{animation:rise 260ms var(--ease) both}
/* Spatial motion collapses to a short crossfade; the clock and the step log are
   information and are left alone. */
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important;scroll-behavior:auto}
  .land{animation:fade 140ms both}
  .step.now .dot{animation:none;opacity:1}
}

@media print{
  *{background:transparent !important;color:#111111 !important;
    box-shadow:none !important}
  body{background:#FFFFFF !important;font-family:var(--serif)}
  body::before,.top,.askblock,#hint,.device,.wait,.skel,.stop{display:none !important}
  .shell{max-width:none;padding:0}
  #view-ask{display:block}
  .rail{position:static;max-height:none;overflow:visible;border:0;
    margin-top:24pt;padding-top:0}
  .sheet{border:0;margin:0;padding:0}
  .answer{font-size:12pt;max-width:none}
  .cite,.cite .n,.panel,.row,.card{border-color:#BBBBBB}
  .cites{border-bottom-color:#111111}
  .mark-n{text-decoration:none}
}
</style>
</head><body>
<div class="shell">

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M50 22c9 13 20 22 20 36a20 20 0 0 1-40 0c0-8 4-13 8-18 1 6 4 9 8 10-2-9 0-19 4-28z" fill="currentColor"/>
      <path d="M50 54c4 4 7 8 7 12a7 7 0 0 1-14 0c0-4 3-8 7-12z" fill="var(--ground)"/>
    </svg>
    <div>
      <h1>LAST LIGHT</h1>
      <p class="tag">an off-grid digital grimoire</p>
    </div>
  </div>
  <button type="button" id="open-browse" class="ghost">Browse</button>
</header>

<main>

<section id="view-ask">
  <div class="col">
    <form id="askform" class="askblock">
      <input id="q" type="text" name="q" maxlength="500" autocomplete="off"
             autocapitalize="sentences" enterkeyhint="send"
             aria-label="Ask the shelf a question"
             placeholder="how do I stop severe bleeding">
      <button type="submit" id="go" class="go">Ask</button>
    </form>

    <div id="hint">
      <p class="promise">The Archivist answers out of the books on this device.
        <b>It names the book and the page, or it says the shelf does not cover it.</b></p>
      <p class="label">People ask</p>
      <div class="examples">
        <button type="button" class="eg">what do I do for a deep burn</button>
        <button type="button" class="eg">how do I purify water</button>
        <button type="button" class="eg">how do I splint a broken arm</button>
      </div>
    </div>

    <section id="result" aria-live="polite" tabindex="-1"></section>
  </div>

  <aside class="rail">
    <div id="sources" hidden></div>
    <div class="device">
      <p class="label">On this device</p>
      <p id="status" class="status">Reading the shelf list.</p>
      <p id="engine" class="cost" hidden></p>
    </div>
  </aside>
</section>

<section id="view-browse" hidden></section>

</main>
</div>
<script>
(function(){
"use strict";

// Fixtures behind ?demo=, so every state on this page can be read and corrected
// on a machine that has no Tiiny in front of it. The live page never reaches
// them: without the parameter every call is a same-origin fetch.
var DEMO = new URLSearchParams(location.search).get("demo") || "";

// A fixture prettier than the device is worse than no fixture: the shelves here
// were in the order that made the nicest sentence and the answer was written in
// tidy paragraphs, and both of those hid a defect from every screenshot taken
// before the page met the real server. These two now hold what came back.
var HEALTH = {
  corpus:{documents:6043, chunks:27746, vectors:27746, subjects:2500},
  // documents desc, which is the order /api/health returns them in.
  shelves:[{name:"Vikidia", documents:5934, pages:5934},
           {name:"zimgit survival shelf", documents:109, pages:12605}],
  device:{reachable:true, chat_model:"Qwen/Qwen3-8B"}
};
// Captured off the device, kept to the character: a numbered list with a single
// newline between the steps and not one blank line in it.

  q:"how do I purify water", secs:9.99, refused:false, cited:[1,3,6],
  answer:"1. Strain water through a paper towel or clean cloth to remove dirt and "

  sources:["Protection in the Nuclear Age · p32",
           "Safe Water School Training Manual · pp34-35",

           "Wilderness Medicine Course · pp151-152",
           "Survival Manual · p59",

var REFUSED = {

           "Computer science · Vikidia", "Password · Vikidia",

  {doc_id:12, title:"Foxfire 1", pages:498},
  {doc_id:13, title:"Foxfire 2", pages:512},

  {doc_id:15, title:"Nuclear War Survival Skills", pages:510},
  {doc_id:16, title:"SAS Survival Handbook", pages:576},
  {doc_id:17, title:"War Surgery in Afghanistan and Iraq", pages:488},
  {doc_id:18, title:"Where There Is No Doctor", pages:503}]};
var SUBJECTS = {subjects:[
  {name:"influenza", documents:14, mentions:184},
  {name:"radiological", documents:9, mentions:141},
  {name:"suture", documents:11, mentions:97},
  {name:"antiviral", documents:6, mentions:88},
  {name:"quarantine", documents:12, mentions:76},
  {name:"fallout", documents:8, mentions:212}]};
var SUBJECT = {name:"suture", docs:11, mentions:97, read:30,
  sources:["War Surgery in Afghanistan and Iraq · zimgit survival shelf",
           "Where There Is No Doctor · zimgit survival shelf",
           "A Book for Midwives · zimgit survival shelf"],
  answer:"A suture is a stitch that closes a wound, and the books treat it as a "
    + "decision before it is a technique. Close a wound only when it is clean and "
    + "less than a day old; a dirty or older wound is packed open and watched."};

// Each demo types the question its own fixture answers, so what is echoed on
// screen is what is in the box.
var DEMO_Q = {answer:ANSWER.q, refused:REFUSED.q,
              waiting:"how do I stop severe bleeding",
              unreachable:"how do I stop severe bleeding"};

var ASK_STEPS = [{at:0, label:"Reading the shelf"},
                 {at:700, label:"Reading the passages"},
                 {at:20000, label:"Writing the answer"}];
// profile() runs no citation guard, so this script has no citation step. The
// screen must not claim a check the device does not perform.
var SUBJECT_STEPS = [{at:0, label:"Reading every passage that names it"},
                     {at:700, label:"Writing the answer"}];

// More rows than this on one shelf and the filter is drawn. A shelf of eight is
// read; a shelf of 109 is searched, and 5,934 is not read by anybody.
var FILTER_AT = 25;

// One breakpoint, named once. The CSS pins the ask bar below this width and
// makeRoom() has to hold back exactly the space the CSS took.
var PHONE = "(max-width:699px)";

var health = null;      // the last good /api/health, read by three screens
var healthFails = 0;    // two in a row before the screen says the server is gone
var shelfList = null;   // nothing is fetched for Browse until Browse is opened
var flight = null;      // the AbortController of whatever is in the air
var askWait = null;     // the waiting block under the ask box, if one is up
var subjWait = null;    // the waiting block under a subject, if one is up

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// Grouping is written out rather than left to toLocaleString, which follows the
// device locale and would print the same corpus two ways on two phones.
function num(n){
  return String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ",");
}

function secs(n){
  var w = Math.round(n);
  return w + (w === 1 ? " second" : " seconds");
}

function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Every fetch goes through here, so the sentence a failure shows is written
// once. The status code rides along on the error because 503 is the one code
// with a screen of its own.
function call(url, opt){
  if (DEMO) return demo(url);
  return fetch(url, opt).then(function(r){
    return r.json().then(function(j){
      if (!r.ok){
        var e = new Error(j.error || "The server answered with an error.");
        e.status = r.status;
        throw e;
      }
      return j;
    });
  });
}

function demo(url){
  function soon(v){ return new Promise(function(res){ setTimeout(function(){ res(v); }, 60); }); }
  if (url === "/api/health"){
    if (DEMO === "unreachable"){
      return soon({corpus:HEALTH.corpus, shelves:HEALTH.shelves,
                   device:{reachable:false, chat_model:null}});
    }
    return soon(HEALTH);
  }
  if (url === "/api/ask"){
    if (DEMO === "unreachable"){
      return new Promise(function(_, rej){
        setTimeout(function(){
          var e = new Error("The Archivist cannot reach the Tiiny.");
          e.status = 503;
          rej(e);
        }, 60);
      });
    }
    if (DEMO === "waiting") return new Promise(function(){});
    return soon(DEMO === "refused" ? REFUSED : ANSWER);
  }
  if (url === "/api/shelves") return soon(HEALTH.shelves);
  if (url.indexOf("/api/books") === 0){
    var want = decodeURIComponent(url.split("shelf=")[1] || BOOKS.shelf);
    return soon({shelf:want, books:BOOKS.books});
  }
  if (url.indexOf("/api/subjects") === 0) return soon(SUBJECTS);
  if (url.indexOf("/api/subject?") === 0) return soon(SUBJECT);
  return Promise.reject(new Error("not found"));
}

/* ------------------------------------------------------------------ health */

function isEncyclopaedia(s){ return /vikidia/i.test(s.name); }

function shelfWords(s){
  if (/survival/i.test(s.name)) return num(s.documents) + " books on the survival shelf";
  if (isEncyclopaedia(s)) return "an encyclopaedia";
  return num(s.documents) + " books on the " + s.name + " shelf";
}

function shelfPlace(s){
  if (/survival/i.test(s.name)) return "the survival shelf";
  if (isEncyclopaedia(s)) return "the encyclopaedia";
  return "the " + s.name + " shelf";
}

// The shelves arrive documents desc, which puts 5,934 articles in front of 109
// books and opens the one line that says how much shelf there is with an
// indefinite article: "an encyclopaedia, and 109 books on the survival shelf."
// The books are what somebody came for, so they lead and the encyclopaedia
// trails. This orders the two sentences, never the browse cards, which are
// right to show the biggest shelf first.
function inSentenceOrder(list){
  var books = [], trailing = [];
  list.forEach(function(s){ (isEncyclopaedia(s) ? trailing : books).push(s); });
  return books.concat(trailing);
}

function paintStatus(){
  var box = $("status");
  var engine = $("engine");
  box.className = "status";
  // The model that will answer is named whenever there is one, because "the
  // Archivist" is a piece of software and the reader is entitled to know which.
  engine.textContent = health && health.device && health.device.chat_model
    ? "Answering with " + health.device.chat_model + "." : "";
  engine.hidden = !engine.textContent;
  if (!health) return;
  if (health.device.reachable === false){
    box.className = "status band";
    box.textContent = "The Tiiny is not answering. Browsing still works.";
    return;
  }
  if (health.device.chat_model === null){
    box.textContent = "The Tiiny is there and no answer model is loaded. Browsing still works.";
    return;
  }
  var line = inSentenceOrder(health.shelves).map(shelfWords).join(", and ") + ".";
  // A chunk with no vector cannot be found, and the person is entitled to know
  // how much of the shelf a question actually reaches.
  if (health.corpus.vectors !== health.corpus.chunks){
    line += " " + num(health.corpus.vectors) + " of " + num(health.corpus.chunks)
          + " passages are searchable.";
  }
  box.textContent = line;
}

function loadHealth(second){
  return call("/api/health").then(function(j){
    health = j;
    healthFails = 0;
    paintStatus();
  }).catch(function(){
    healthFails += 1;
    var box = $("status");
    $("engine").hidden = true;
    if (healthFails < 2){
      box.className = "status";
      box.textContent = "The shelf list is not loading. Ask anyway, or reload.";
      // One retry, never a loop and never a backoff. Two consecutive failures
      // are what repaints the screen, so a single dropped packet on a wifi link
      // does not tell someone their archive is gone.
      if (!second) setTimeout(function(){ loadHealth(true); }, 1200);
      return;
    }
    box.className = "status band";
    box.textContent = "";
    box.appendChild(el("span", null, "This page cannot reach the server."));
    box.appendChild(el("span", null, "The page is still here. The answers are not. "
      + "Start LAST LIGHT on the Tiiny again, or reload this page."));
    // The shelf counts are left off rather than drawn as zeros. A zero here
    // would be a lie about the corpus.
  });
}

/* ----------------------------------------------------------------- waiting */

// There is no spinner anywhere in this file. A progress bar needs a denominator
// and none exists: the same class of question has been measured at 5.8 and at
// 22.2 seconds. The wait is paid for with the shape of the answer to come and a
// log of what the device is doing beside it.
function skeleton(){
  var box = el("div", "skel");
  box.setAttribute("aria-hidden", "true");
  [96, 88, 94, 78, 90, 54].forEach(function(w){
    var line = el("span");
    line.style.width = w + "%";
    box.appendChild(line);
  });
  return box;
}

function waiting(steps, onStop){
  var t0 = Date.now();
  var marks = [];       // the step timeouts, cleared by the cancel this returns
  var beat = 0;
  var side = el("div", "wait");
  var list = el("div");
  var clock = el("p", "clock");
  var stop = el("button", "stop", "Stop");
  stop.type = "button";
  stop.addEventListener("click", onStop);
  // Only the steps speak. The clock is outside the live region because a second
  // counter inside one announces itself once a second, for forty seconds.
  list.setAttribute("aria-live", "polite");
  side.appendChild(el("p", "label", "Working"));
  side.appendChild(list);
  side.appendChild(clock);
  side.appendChild(stop);

  var current = null;
  function show(label){
    if (current){
      current.className = "step";
      // A step that has passed carries the second it finished, so a done step
      // leaves evidence instead of just scrolling away.
      current.querySelector(".at").textContent =
        Math.floor((Date.now() - t0) / 1000) + " s";
    }
    var row = el("div", "step now");
    row.appendChild(el("span", "dot"));
    row.appendChild(el("span", "what", label));
    row.appendChild(el("span", "at"));
    list.appendChild(row);
    current = row;
  }
  show(steps[0].label);
  steps.slice(1).forEach(function(s){
    marks.push(setTimeout(function(){ show(s.label); }, s.at));
  });

  function paintClock(){
    var n = Math.floor((Date.now() - t0) / 1000);
    clock.textContent = n < 35 ? secs(n) + ". Answers take 5 to 40 seconds."
      : n < 60 ? secs(n) + ". The longest answers take about 40 seconds."
      : secs(n) + ". This is longer than usual. The Tiiny is still working.";
  }
  paintClock();
  // The clock is information, not decoration, so reduced motion leaves it alone.
  beat = setInterval(paintClock, 1000);
  return {node:skeleton(), aside:side, cancel:function(){
    marks.forEach(clearTimeout);
    marks = [];
    if (beat){ clearInterval(beat); beat = 0; }
  }};
}

/* ------------------------------------------------------------- the answers */

// What the shelf was actually searched for, when the Archivist rephrased what
// was said ("I cut my foot" becomes "cut: stop bleeding, clean wound, cover").
// Shown so a wrong answer can be traced to a wrong search, not left a mystery.
function searchedLine(text){
  var d = el("div", "searched");
  d.textContent = "searched for: " + text;
  return d;
}

function prose(text, cited){
  var box = el("div", "answer");
  String(text).split(/\n\s*\n/).forEach(function(para){
    var p = document.createElement("p");
    // A blank line starts a paragraph and a single newline stays a line break.
    // The Archivist answers a procedure question as a numbered list with one
    // newline between the steps and no blank line anywhere, so folding those
    // into spaces ran eight steps into one block: thirty unbroken lines on a
    // phone, and nobody finds step five in that with one hand.
    p.innerHTML = marks(esc(para).replace(/[ \t]*\n/g, "<br>"), cited);
    box.appendChild(p);
  });
  return box;
}

// A [n] the guard did not accept is left as plain quiet prose, never as a link.
// archivist computes the hallucinated set and never returns it, so this is the
// only way a reader can see that the Archivist pointed at nothing.
function marks(html, cited){
  return html.replace(/\[(\d+)\]/g, function(whole, n){
    return cited.indexOf(Number(n)) >= 0
      ? '<a class="mark-n" href="#cite-' + n + '"><sup>' + n + '</sup></a>'
      : '<span class="uncited">' + whole + '</span>';
  });
}

// Everything entities.profile() answers - the entity path through ask() and a
// subject on the index - numbers its brackets against the thirty passages it
// read and then hands back only the handful of books those passages came from.
// So [30] on that answer points at nothing this page shows or could show, and
// it is not the guard's signal either, because that path runs no guard. The
// markers come out. Measured on the device: one "what is a deadfall" carried 49
// of them over 8 books, in runs of twelve that ate whole lines.
function unmarked(text){
  return String(text).replace(/[ \t]*(?:\[\d+\])+/g, "");
}

// cite() writes "{title} · {where}", and where is a page range on a book and a
// shelf name on a wiki article. Neither is assumed.
function splitTag(s){
  var i = String(s).indexOf(" · ");
  return i < 0 ? [String(s), ""] : [String(s).slice(0, i), String(s).slice(i + 3)];
}

function locator(w){
  return /^pp?\d/.test(w) ? w.replace(/^(pp?)/, "$1 ") : w;
}

function citeRow(n, tag, id){
  var parts = splitTag(tag);
  // Three of the four callers draw no number, and a row with an empty number
  // column is a 38px indent of nothing. The class collapses it.
  var row = el("div", n === null ? "cite plain" : "cite");
  if (id) row.id = id;
  if (n !== null) row.appendChild(el("span", "n", "[" + n + "]"));
  row.appendChild(el("span", "t", parts[0]));
  if (parts[1]) row.appendChild(el("span", "w", locator(parts[1])));
  return row;
}

// The books an answer stood on live in the margin beside it, not under it, so a
// citation mark points at something already on screen.
function sourceList(label, rows){
  var box = el("div", "srcs");
  box.appendChild(el("p", "label", label));
  var shelf = el("div", "cites");
  rows.forEach(function(r){ shelf.appendChild(citeRow(r.n, r.tag, r.id)); });
  box.appendChild(shelf);
  return box;
}

function noteAside(label, text){
  var box = el("div");
  box.appendChild(el("p", "label", label));
  box.appendChild(el("p", "cost flush", text));
  return box;
}

function echo(q){ return el("p", "echo", q); }

function modelAnswer(r){
  var box = el("div", "sheet land");
  box.appendChild(echo(r.q));
  if (r.searched) box.appendChild(searchedLine(r.searched));
  box.appendChild(prose(r.answer, r.cited));
  box.appendChild(el("p", "cost", secs(r.secs) + ". The Archivist cited "
    + r.cited.length + " of the " + r.sources.length + " passages it read."));
  var rows = [];
  r.cited.forEach(function(n){
    var tag = r.sources[n - 1];
    // cited is 1-based into sources. A row that is not there is dropped
    // rather than taking the whole answer down with it.
    if (typeof tag === "string") rows.push({n:n, tag:tag, id:"cite-" + n});
  });
  return {main:box, aside:rows.length ? sourceList("From", rows)
                                      : noteAside("From", "No passage is cited.")};
}

// The entity path is not a different mode and is not labelled as one. It is how
// "what is a deadfall" gets answered, and it looks like an answer.
function entityAnswer(r){
  var box = el("div", "sheet land");
  box.appendChild(echo(r.q));
  if (r.searched) box.appendChild(searchedLine(r.searched));
  box.appendChild(prose(unmarked(r.answer), r.cited));
  box.appendChild(el("p", "cost", secs(r.secs)
    + ". The Archivist read every passage that names it."));
  var rows = r.sources.map(function(tag){ return {n:null, tag:tag, id:null}; });
  return {main:box, aside:rows.length ? sourceList("Read across " + r.via, rows) : null};
}

function hitTag(h){
  return h.title + " · " + (h.pages && h.pages.length === 2
    ? (h.pages[0] === h.pages[1] ? "p" + h.pages[0]
                                 : "pp" + h.pages[0] + "-" + h.pages[1])
    : h.source);
}

// A refusal is a result, not a failure: same slot, same ceremony, no red.
function refusalPanel(r){
  var box = el("div", "panel land");
  box.appendChild(echo(r.q));
  // The archivist's own prompt forbids claiming the archive lacks something,
  // only that the passages it read do not cover it. This heading is that rule
  // applied to the refusal itself.
  box.appendChild(el("h2", null, "Nothing it read covers this."));
  box.appendChild(el("p", null, "The Archivist searched the shelf and read the "
    + "passages it found. None of them answer this question. It does not guess. Ask "
    + "it in different words, or open one of these books."));
  if (health && health.shelves){
    box.appendChild(el("p", "said",
      "It searched " + inSentenceOrder(health.shelves).map(shelfPlace).join(" and ")
      + "."));
  }
  // The guard's own confession, in the guard's own words. It is the one place
  // the product explains its rule, so it is passed through rather than rewritten.
  var nl = String(r.answer).indexOf("\n");
  if (nl >= 0){
    var held = String(r.answer).slice(nl + 1).trim()
      .replace(/^\(/, "").replace(/\)$/, "").trim();
    if (held){
      box.appendChild(el("p", "said", held.charAt(0).toUpperCase() + held.slice(1) + "."));
    }
  }
  box.appendChild(el("p", "cost", secs(r.secs) + "."));
  // Which key is present decides this, never a fallback chain: ask() returns
  // three genuinely different objects.
  var tags = [];
  if (Array.isArray(r.sources)) tags = r.sources.slice(0, 3);
  else if (Array.isArray(r.hits)) tags = r.hits.slice(0, 3).map(hitTag);
  var rows = tags.map(function(tag){ return {n:null, tag:tag, id:null}; });
  return {main:box, aside:rows.length ? sourceList("It read", rows) : null};
}

function unreachableNode(heading, withBrowse){
  var box = el("div", "panel land");
  box.appendChild(el("h2", null, heading));
  if (withBrowse){
    box.appendChild(el("p", null, "The question was not sent, so nothing was lost. "
      + "The shelves and the subject index are still on this page. Open Browse and "
      + "read the books."));
    var b = el("button", "go", "Browse the shelves");
    b.type = "button";
    b.addEventListener("click", openBrowse);
    box.appendChild(b);
  }
  return box;
}

function serverNode(){
  var box = el("div", "panel land");
  box.appendChild(el("h2", null, "This page cannot reach the server."));
  box.appendChild(el("p", null, "The page is still here. The answers are not. Start "
    + "LAST LIGHT on the Tiiny again, or reload this page."));
  return box;
}

function plainPanel(heading, body){
  var box = el("div", "panel land");
  box.appendChild(el("h2", null, heading));
  if (body) box.appendChild(el("p", null, body));
  return box;
}

// One result, two places: the reading surface and the margin beside it. Every
// call clears both, so a stale shelf never stands beside a new answer.
function place(node, aside){
  var slot = $("result");
  slot.textContent = "";
  slot.appendChild(node);
  var rail = $("sources");
  rail.textContent = "";
  if (aside) rail.appendChild(aside);
  rail.hidden = !aside;
  // A keyboard and a screen reader both land on the answer, not back on the input.
  slot.focus();
}

/* --------------------------------------------------------------- the asking */

// The ask bar leaves the flow on a phone, so the view has to hold the space
// back or the last line sits under it for good. Measured rather than guessed,
// because the bar grows with the safe-area inset.
function makeRoom(){
  var view = $("view-ask");
  var form = $("askform");
  view.style.paddingBottom = matchMedia(PHONE).matches
    ? (form.offsetHeight + 24) + "px" : "";
}

function settle(){
  if (askWait){ askWait.cancel(); askWait = null; }
  var input = $("q");
  input.readOnly = false;
  var go = $("go");
  go.textContent = "Ask";
  go.removeAttribute("aria-disabled");
  flight = null;
}

// Nothing here claims the device stopped working, because it has not. Only the
// page stopped listening, and the question is still in the box.
function stopAsk(){
  if (flight) flight.abort();
  // settle(), not just a cancel. The line this prints promises the question is
  // still in the box, and the abort takes the .catch down its early return, so
  // without this the box stays readonly behind a button still reading Asking
  // and the promise is a lie until somebody reloads the page.
  settle();
  $("hint").hidden = false;
  place(el("p", "cost", "Stopped. The question is still in the box."));
}

function submitAsk(ev){
  ev.preventDefault();
  // One question at a time. The Asking button is out of the pointer's reach, but
  // Enter in the box is not, and a second submit puts a second five to forty
  // second inference on a device somebody else may be using while leaving the
  // first waiting block's timers firing at nodes nothing can see any more.
  if (flight) return;
  var input = $("q");
  var text = input.value.trim();
  if (!text) return;

  // readonly rather than disabled, so the question stays readable and selectable
  // through a forty second wait.
  input.readOnly = true;
  input.blur();
  var go = $("go");
  go.textContent = "Asking";
  go.setAttribute("aria-disabled", "true");
  $("hint").hidden = true;
  // The question stays in the box to be edited. The placeholder only speaks if
  // the box is cleared, and by then the first answer is already on screen.
  input.placeholder = "ask another";
  makeRoom();

  flight = new AbortController();
  askWait = waiting(ASK_STEPS, stopAsk);
  place(askWait.node, askWait.aside);

  // No client timeout under the server's own, so a slow answer is never cut off.
  call("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({q:text}), signal:flight.signal})
    .then(function(r){
      settle();
      var out = r.refused === true ? refusalPanel(r)
              : "via" in r ? entityAnswer(r)
              : modelAnswer(r);
      place(out.main, out.aside);
    })
    .catch(function(err){
      if (err.name === "AbortError") return;    // stopAsk already painted
      settle();
      if (err.status === 503){
        // The server's own sentence is the sentence on screen, so there is no
        // second copy of it here to drift.
        place(unreachableNode(err.message, true));
        loadHealth();
      } else {
        place(serverNode());
      }
    });
}

/* --------------------------------------------------------------- the browse */

var indexShelf = "";    // "" is the ALL chip

function showAsk(){
  $("view-browse").hidden = true;
  $("view-ask").hidden = false;
  makeRoom();
}

function openBrowse(){
  $("view-ask").hidden = true;
  $("view-browse").hidden = false;
  showShelves();
}

function bar(backLabel, crumb, onBack){
  var row = el("div", "bar");
  var b = el("button", "ghost", backLabel);
  b.type = "button";
  b.addEventListener("click", onBack);
  row.appendChild(b);
  row.appendChild(el("span", "crumb", crumb));
  return row;
}

function card(title, meta, onOpen){
  var b = el("button", "card");
  b.type = "button";
  b.appendChild(el("span", "t", title));
  b.appendChild(el("span", "m", meta));
  b.addEventListener("click", onOpen);
  return b;
}

function shelfTotal(name){
  if (!health || !health.shelves) return null;
  for (var i = 0; i < health.shelves.length; i++){
    if (health.shelves[i].name === name) return health.shelves[i].documents;
  }
  return null;
}

function showShelves(){
  var v = $("view-browse");
  v.textContent = "";
  v.appendChild(bar("Back to ask", "SHELVES", showAsk));
  var body = el("div");
  v.appendChild(body);

  var got = shelfList ? Promise.resolve(shelfList) : call("/api/shelves");
  got.then(function(list){
    shelfList = list;
    var cards = el("div", "cards");
    list.forEach(function(s){
      var meta = /vikidia/i.test(s.name)
        ? num(s.documents) + " articles, plain language"
        : num(s.documents) + " books, " + num(s.pages) + " pages";
      cards.appendChild(card(s.name, meta, function(){ showBooks(s); }));
    });
    if (health && health.corpus){
      cards.appendChild(card("Subject index",
        num(health.corpus.subjects) + " subjects the books name themselves", showIndex));
    }
    body.appendChild(cards);
  }).catch(function(){
    body.appendChild(serverNode());
  });
}

function showBooks(shelf){
  var v = $("view-browse");
  v.textContent = "";
  v.appendChild(bar("Back to shelves", "SHELVES / " + shelf.name.toUpperCase(), showShelves));
  var body = el("div");
  v.appendChild(body);

  call("/api/books?shelf=" + encodeURIComponent(shelf.name)).then(function(d){
    var total = shelfTotal(d.shelf);
    var count = el("p", "cost tally");
    // The same two-column index the subjects use. A shelf of 109 titles down one
    // 1,200px column puts the page count a hand's width from the book.
    var list = el("div", "index");
    var filter = null;

    function paint(){
      var q = filter ? filter.value.trim().toLowerCase() : "";
      var rows = q ? d.books.filter(function(b){
        return b.title.toLowerCase().indexOf(q) >= 0;
      }) : d.books;
      count.textContent = q
        ? num(rows.length) + " of " + num(d.books.length) + " books match"
        : num(d.books.length)
          + (total === null || total === d.books.length ? "" : " of " + num(total))
          + " books, by title.";
      list.textContent = "";
      rows.forEach(function(b){
        // Not a button. No API route returns a book's text, so a row that
        // looked tappable would be lying about what this page can do.
        var row = el("div", "row");
        row.id = "book-" + b.doc_id;
        row.appendChild(el("span", "t", b.title));
        row.appendChild(el("span", "m", num(b.pages) + " pages"));
        list.appendChild(row);
      });
    }

    // The route hands over the whole shelf precisely so this can filter it, so
    // the filter is offered on the length of the list and not on whether the
    // server truncated. Gated on truncation it never appeared at all: 5,934
    // Vikidia articles came back whole every time, and the filter the copy
    // sheet promises was dead code on the only shelf that needs it.
    if (d.books.length > FILTER_AT){
      filter = el("input", "filter");
      filter.type = "text";
      filter.placeholder = "filter by title";
      filter.autocomplete = "off";
      filter.setAttribute("aria-label", "Filter this shelf by title");
      filter.addEventListener("input", paint);
      body.appendChild(filter);
    }
    body.appendChild(count);
    body.appendChild(list);
    paint();
  }).catch(function(err){
    body.appendChild(plainPanel(err.message, null));
  });
}

function showIndex(){
  var v = $("view-browse");
  v.textContent = "";
  v.appendChild(bar("Back to shelves", "SHELVES / SUBJECT INDEX", showShelves));
  var body = el("div");
  v.appendChild(body);

  if (health && health.shelves){
    var chips = el("div", "chips");
    var all = el("button", "chip" + (indexShelf === "" ? " on" : ""), "ALL");
    all.type = "button";
    all.addEventListener("click", function(){ indexShelf = ""; showIndex(); });
    chips.appendChild(all);
    health.shelves.forEach(function(s){
      var c = el("button", "chip" + (indexShelf === s.name ? " on" : ""), s.name);
      c.type = "button";
      c.addEventListener("click", function(){ indexShelf = s.name; showIndex(); });
      chips.appendChild(c);
    });
    body.appendChild(chips);
  }

  // Ordering by documents returns water, ground, side, keep, which is a word
  // frequency list. Aboutness returns influenza, radiological, suture, which is
  // the index this screen is meant to be.
  var url = "/api/subjects?limit=200&order=aboutness"
    + (indexShelf ? "&shelf=" + encodeURIComponent(indexShelf) : "");
  call(url).then(function(d){
    var filter = el("input", "filter pin");
    filter.type = "text";
    filter.placeholder = "filter the index";
    filter.autocomplete = "off";
    filter.setAttribute("aria-label", "Filter the subject index");
    var count = el("p", "cost tally");
    var list = el("div", "index");

    function paint(){
      var q = filter.value.trim().toLowerCase();
      var rows = q ? d.subjects.filter(function(s){
        return s.name.toLowerCase().indexOf(q) >= 0;
      }) : d.subjects;
      count.textContent = q
        ? num(rows.length) + " of " + num(d.subjects.length) + " subjects match"
        : num(d.subjects.length) + " subjects the books name themselves.";
      list.textContent = "";
      rows.forEach(function(s){
        var row = el("button", "row");
        row.type = "button";
        row.appendChild(el("span", "t", s.name));
        row.appendChild(el("span", "m",
          "in " + num(s.documents) + " books, " + num(s.mentions) + " mentions"));
        row.addEventListener("click", function(){ showSubject(s.name); });
        list.appendChild(row);
      });
    }
    filter.addEventListener("input", paint);
    body.appendChild(filter);
    body.appendChild(count);
    body.appendChild(list);
    paint();
  }).catch(function(){
    body.appendChild(serverNode());
  });
}

function showSubject(name){
  var v = $("view-browse");
  v.textContent = "";
  v.appendChild(bar("Back to the index", "SHELVES / SUBJECT INDEX / " + name.toUpperCase(),
                    showIndex));
  var body = el("div");
  v.appendChild(body);

  // A profile runs the chat model. With the device down there is nothing to ask,
  // so nothing is sent and the screen says so.
  if (health && health.device && health.device.reachable === false){
    body.appendChild(unreachableNode("The Tiiny is not answering. Browsing still works.",
                                     false));
    return;
  }

  var run = new AbortController();
  subjWait = waiting(SUBJECT_STEPS, function(){
    run.abort();
    if (subjWait){ subjWait.cancel(); subjWait = null; }
    showIndex();
  });
  body.appendChild(subjWait.node);
  body.appendChild(subjWait.aside);

  call("/api/subject?name=" + encodeURIComponent(name), {signal:run.signal})
    .then(function(d){
      if (subjWait){ subjWait.cancel(); subjWait = null; }
      body.textContent = "";
      if (d.error){
        body.appendChild(plainPanel("That subject is not in this archive.", d.error));
        return;
      }
      body.appendChild(el("p", "subject", d.name));
      var line = "In " + num(d.docs) + " books. " + num(d.mentions) + " mentions.";
      if (d.read !== undefined) line += " " + num(d.read) + " passages read.";
      body.appendChild(el("p", "cost", line));
      // The same dead numbering as the entity path, off the same profile().
      body.appendChild(prose(unmarked(d.answer), []));
      if (d.sources.length){
        body.appendChild(sourceList("From", d.sources.map(function(tag){
          return {n:null, tag:tag, id:null};
        })));
      }
    })
    .catch(function(err){
      if (err.name === "AbortError") return;
      if (subjWait){ subjWait.cancel(); subjWait = null; }
      body.textContent = "";
      body.appendChild(plainPanel("That subject is not in this archive.", err.message));
    });
}

/* ----------------------------------------------------------------- wiring */

$("askform").addEventListener("submit", submitAsk);
window.addEventListener("resize", makeRoom);
$("open-browse").addEventListener("click", openBrowse);
// An example puts its words in the box and hands the box back. It never asks on
// somebody's behalf: the question is theirs to send.
Array.prototype.forEach.call(document.querySelectorAll(".eg"), function(b){
  b.addEventListener("click", function(){
    var input = $("q");
    input.value = b.textContent;
    input.focus();
  });
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") showAsk();
});

// A hardware keyboard gets the caret. A phone does not, because a keyboard
// thrown over the shelf line stops the person reading what is on the device.
if (matchMedia("(pointer:fine)").matches) $("q").focus();

makeRoom();
loadHealth();

if (DEMO === "answer" || DEMO === "refused" || DEMO === "waiting"){
  $("q").value = DEMO_Q[DEMO];
  setTimeout(function(){ $("askform").requestSubmit(); }, 140);
} else if (DEMO === "unreachable"){
  $("q").value = DEMO_Q[DEMO];
  setTimeout(function(){ $("askform").requestSubmit(); }, 220);
} else if (DEMO === "browse"){
  setTimeout(openBrowse, 180);
} else if (DEMO === "books" || DEMO === "index" || DEMO === "subject"){
  setTimeout(function(){
    openBrowse();
    setTimeout(function(){
      // By name, not by index into HEALTH.shelves: the fixture describes one
      // shelf and an ordering change should not open a different one.
      if (DEMO === "books") showBooks({name:BOOKS.shelf});
      else if (DEMO === "index") showIndex();
      else showSubject("suture");
    }, 140);
  }, 180);
}

})();
</script>
</body></html>
